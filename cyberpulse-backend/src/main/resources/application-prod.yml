spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    show-sql: false
    properties:
      hibernate:
        format_sql: false

server:
  forward-headers-strategy: framework

springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

logging:
  level:
    root: INFO
    cyberpulse: INFO

jwt:
  secret: ${JWT_SECRET}

cyberpulse:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS}
  security:
    swagger-enabled: false
  rate-limit:
    enabled: true
    auth:
      max-requests: 20
      window-seconds: 60
  ai:
    provider: ${AI_PROVIDER:gemini}
    api-key: ${AI_API_KEY:}
    model: ${AI_MODEL:gemini-2.5-flash}
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  mail:
    from: ${MAIL_FROM:noreply@cyberpulse.io}
